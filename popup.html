<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:14px 16px 16px; font:14px system-ui,-apple-system,sans-serif;
         background:#1a1c22; color:#e6e8ee; min-width:220px; }
  h1 { margin:0 0 4px; font-size:15px; }
  p.sub { margin:0 0 12px; font-size:11px; color:#8a90a2; }
  .levels { display:flex; flex-direction:column; gap:6px; }
  button {
    display:flex; align-items:center; gap:8px;
    padding:9px 12px; border-radius:8px;
    border:1px solid #2b2e39; background:#23262f; color:#e6e8ee;
    font-size:13px; cursor:pointer; transition:.15s; text-align:left;
  }
  button:hover { background:#2b2e3a; }
  button.on { background:#0b3a25; border-color:#00e676; color:#7bffb5;
              box-shadow:0 0 0 1px #00e676 inset; }
  .dot { width:8px; height:8px; border-radius:50%; background:#333; flex-shrink:0; }
  button.on .dot { background:#00e676; }
  .foot { margin-top:12px; font-size:11px; color:#666e82; line-height:1.5;
          border-top:1px solid #2b2e39; padding-top:10px; }
  .foot b { color:#8f97ab; font-weight:normal; }
</style>
</head>
<body>
  <h1>WallRush Helper</h1>
  <p class="sub">Strength of the suggestion</p>
  <div class="levels" id="levels">
    <button data-level="1"><span class="dot"></span>🙂 Easy</button>
    <button data-level="2"><span class="dot"></span>😎 Normal</button>
    <button data-level="3"><span class="dot"></span>🔥 Hard</button>
    <button data-level="4"><span class="dot"></span>💀 Hardcore</button>
  </div>
  <p class="foot" id="foot"><b>—</b></p>
  <button id="download-log" style="margin-top:12px; width:100%;">📥 Download current Log</button>
<button id="btn-auto-play" style="margin-top:8px; width:100%;">🤖 Auto Play: OFF</button>
<script src="popup.js"></script>
</body>
</html>
